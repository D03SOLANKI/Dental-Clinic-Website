version: "2"
type: frontend
tech_stack:
  - TypeScript
  - React (Next.js 16.2.6 App Router)
  - Vanilla CSS
  - Tailwind CSS v4
  - "@supabase/supabase-js"
  - Framer Motion
  - Resend
routes:
  - path: /
    file: src/app/(public)/page.tsx
    auth_required: false
    description: Homepage showing facility summary and dentist profile summaries
  - path: /about
    file: src/app/(public)/about/page.tsx
    auth_required: false
    description: About page detailing clinical services and Navrangpura facility details
  - path: /services
    file: src/app/(public)/services/page.tsx
    auth_required: false
    description: Offerings page listing clinic dental treatment categories
  - path: /doctors
    file: src/app/(public)/doctors/page.tsx
    auth_required: false
    description: Specialists roster page listing all dentists
  - path: /gallery
    file: src/app/(public)/gallery/page.tsx
    auth_required: false
    description: Interactive gallery with category filtering and visual lightbox
  - path: /faq
    file: src/app/(public)/faq/page.tsx
    auth_required: false
    description: FAQ page with accordion categories and live filter search bar
  - path: /before-after
    file: src/app/(public)/before-after/page.tsx
    auth_required: false
    description: Before-after clinical case studies with direct book-prefill triggers
  - path: /book
    file: src/app/(public)/book/page.tsx
    auth_required: false
    description: 3-step interactive appointment booking wizard
  - path: /contact
    file: src/app/(public)/contact/page.tsx
    auth_required: false
    description: Contact form to submit messages and feedback
  - path: /admin
    file: src/app/(admin)/admin/page.tsx
    auth_required: false
    description: Administrative dashboard to manage bookings, messages, and configurations
features:
  - name: Appointment Booking Wizard
    description: Complete 3-step interactive booking form wizard
    files:
      - src/app/(public)/book/page.tsx
      - src/components/forms/booking-form.tsx
      - src/app/actions/booking.ts
    entry_route: /book
    user_interactions:
      - Select a dental treatment category
      - Select an assigned doctor
      - Choose a date from the calendar picker
      - Choose an available timeslot button
      - Fill in contact details (name, email, phone, notes)
      - Click Submit Booking button
    api_calls:
      - method: Server Action
        endpoint: bookAppointmentAction
    auth_required: false
  - name: Clinic Administration Console
    description: Managing appointments, message inquiries, settings, and subscribers
    files:
      - src/app/(admin)/admin/page.tsx
      - src/app/(admin)/admin/admin-client.tsx
      - src/components/layout/admin-sidebar.tsx
    entry_route: /admin
    user_interactions:
      - Click sidebar tabs to switch panels
      - Click sub-tab buttons on top panel
      - Enter query string in search bar to filter
      - Click Confirm or Cancel buttons on appointments
      - Click Delete icon button to remove appointments, subscribers, or messages
      - Toggle simulated action mode checkbox in Settings
    api_calls:
      - method: Server Action
        endpoint: updateAppointmentStatusAction
      - method: Server Action
        endpoint: deleteAppointmentAction
      - method: Server Action
        endpoint: deleteSubscriberAction
      - method: Server Action
        endpoint: deleteContactMessageAction
    auth_required: false
  - name: Gallery Category Filters & Lightbox
    description: Dynamic clinic photo display with category pills and lightbox popups
    files:
      - src/app/(public)/gallery/page.tsx
    entry_route: /gallery
    user_interactions:
      - Click category filter buttons (All, Clinic, Tech, Team)
      - Hover over image cards to view overlay description details
      - Click a photo card to trigger full-screen lightbox modal view
      - Click cross button to dismiss lightbox modal
    auth_required: false
  - name: Contact Inquiry Form
    description: Public submission of contact inquiries and feedback message notes
    files:
      - src/app/(public)/contact/page.tsx
      - src/app/actions/contact.ts
    entry_route: /contact
    user_interactions:
      - Fill name, email, phone, and message input fields
      - Click Send Message button to submit
    api_calls:
      - method: Server Action
        endpoint: submitContactAction
    auth_required: false
  - name: Newsletter Subscription Form
    description: Footer email signup for clinical newsletter subscription campaigns
    files:
      - src/components/layout/footer.tsx
      - src/app/actions/newsletter.ts
    entry_route: /
    user_interactions:
      - Fill in email input inside the footer newsletter container
      - Click Subscribe button
    api_calls:
      - method: Server Action
        endpoint: subscribeNewsletterAction
    auth_required: false
known_limitations:
  - issue: Doctors, Services, Blog Posts, and Testimonials editing in the admin panel are UI-only
    location: src/app/(admin)/admin/admin-client.tsx
    impact: Roster edits, treatment additions, article statuses, and reviews moderation are saved locally in component state and do not persist across database round-trips.
